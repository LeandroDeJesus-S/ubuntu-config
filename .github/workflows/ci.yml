name: Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
jobs:
  unit_tests:
    name: test script
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v6

      - name: Run
        run: |
          chmod +x $(ls *.sh)
          sudo sh -c ./configure.sh
